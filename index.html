<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="85mm — リニューアルちゅう">
  <meta name="theme-color" content="#ffffff">
  <title>85mm</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="notice" aria-label="サイトリニューアルのお知らせ">
      <h1 class="notice-title">リニューアルちゅう</h1>
      <div class="date-and-time" aria-label="日本時間">
        <time class="date">----/--/--</time>
        <div class="clock-wrap"><time class="clock">--:--</time></div>
      </div>
      <div class="social">
        <a href="https://x.com/suko_hakumai" target="_blank" rel="noopener noreferrer">X : @suko_hakumai</a>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const date = document.querySelector('.date');
      const clock = document.querySelector('.clock');
      const group = document.querySelector('.date-and-time');
      const formatter = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
      });

      function updateClock() {
        const parts = Object.fromEntries(
          formatter.formatToParts(new Date()).map(({ type, value }) => [type, value])
        );
        const { year, month, day, hour, minute } = parts;
        date.textContent = `${year}/${month}/${day}`;
        date.dateTime = `${year}-${month}-${day}`;
        clock.textContent = `${hour}:${minute}`;
        clock.dateTime = `${year}-${month}-${day}T${hour}:${minute}:00+09:00`;
        group.setAttribute('aria-label', `日本時間 ${year}年${month}月${day}日 ${hour}時${minute}分`);
      }

      updateClock();
      setInterval(updateClock, 1000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) updateClock();
      });
    })();
  </script>
</body>
</html>
